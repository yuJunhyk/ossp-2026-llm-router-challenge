[build-system]
requires = ["setuptools>=58", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# 동결된 학습·런타임 파일의 스타일 예외. 이 파일들은 Dev 예산 판정을 통과한
# 제출 구성이라 코드 변경 없이 예외로 문서화한다 (E402: sys.path 조정 후 import,
# E702/E741: 특징 추출부의 압축 표기와 변수명).
[tool.ruff.lint.per-file-ignores]
"analysis/train_linear.py" = ["E402"]
"analysis/os2_features.py" = ["E702", "E741"]
"src/ossp_router/learned_features.py" = ["E702", "E741"]
