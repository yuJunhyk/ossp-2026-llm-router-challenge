name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 런타임이 표준 라이브러리 전용이라 테스트도 의존성 없이 돈다.
      # 컨테이너 격리 테스트는 OSSP_RUN_CONTAINER_TESTS=1일 때만 실행되므로 CI에서는 자동으로 건너뛴다.
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_*.py'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff reuse
      - run: ruff check .
      - run: reuse lint
